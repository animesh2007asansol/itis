name: Breakout Analyzer (Consolidation Breakout)

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["NSE Daily Data Fetch"]
    types: [completed]
  schedule:
    - cron: '30 16 * * 1-5'   # 10 PM IST Mon-Fri fallback

# ── Concurrency guard ─────────────────────────────────────────────────────────
# Only one instance of this workflow runs at a time across all triggers.
# If a run is already in progress when a new trigger fires, the new run is
# queued and waits — it does NOT cancel the running one.
# This prevents two runs writing breakout_signals.json simultaneously and
# avoids hammering the runner while NSE data fetch is still mid-push.
concurrency:
  group: breakout-analyzer
  cancel-in-progress: false   # queue the new run, don't kill the live one

jobs:
  breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main          # always HEAD of main, not the SHA that triggered workflow_run
          fetch-depth: 1

      - name: Pull latest data (race-window safety net)
        run: git pull origin main --ff-only || true

      # ── Verify data is fresh before spending 2 min on analysis ───────────────
      - name: Verify data freshness
        run: |
          echo "=== Latest 10 CSVs on disk ==="
          find data/equity -name "*.csv" | sort | tail -10
          echo "=== Most recent date ==="
          find data/equity -name "*.csv" | sort | tail -1

      # ── Python setup (done once, used by both attempts) ───────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy --quiet

      # ── Attempt 1 ────────────────────────────────────────────────────────────
      - name: Run Breakout Analyzer (attempt 1)
        id: attempt1
        continue-on-error: true      # don't fail the job yet — allow retry
        run: python scripts/breakout_analyzer.py

      # ── Attempt 2 (only runs if attempt 1 failed) ────────────────────────────
      # Waits 60 s before retrying — gives transient issues (I/O, memory) time
      # to clear.  If this also fails the job is marked failed and stops.
      - name: Retry Breakout Analyzer (attempt 2 — only on failure)
        if: steps.attempt1.outcome == 'failure'
        run: |
          echo "⚠️  Attempt 1 failed. Waiting 60 s before retry..."
          sleep 60
          python scripts/breakout_analyzer.py

      # ── Commit output ─────────────────────────────────────────────────────────
      # Runs only if at least one attempt succeeded (default behaviour: skips
      # if any prior non-continue-on-error step failed, which is attempt 2 here).
      - name: Commit breakout_signals.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_analysis/breakout_signals.json
          git diff --staged --quiet \
            && echo "No changes to commit" \
            || git commit -m "Breakout signals [$(date '+%Y-%m-%d')]"
          git push
