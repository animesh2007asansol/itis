name: Pre-Signal Context Analyzer

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Short Hold Analyzer (5-10 Day 10%+ Stocks)", "Seasonal Timing Optimizer (UC1 + UC2)"]
    types: [completed]

jobs:
  presignal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy --quiet
      - name: Run Pre-Signal Analyzer
        run: python scripts/presignal_analyzer.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_analysis/presignal_context.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "Pre-signal context: fingerprints updated [$(date '+%Y-%m-%d')]"
          git push
