name: Seasonal Signals — Prepare JSON

on:
  # Auto-trigger: runs at 6 PM UTC = 11:30 PM IST, Mon–Fri
  # This is 2.5 hrs after the 9 PM IST NSE data fetch, giving plenty of time
  schedule:
    - cron: '30 18 * * 1-5'

  # Manual trigger from GitHub Actions UI — useful for testing
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

jobs:
  prepare-signals:
    name: Prepare Seasonal Signals JSON
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push output files back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show trigger info
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Time (UTC): $(date -u)"
          echo "Time (IST): $(TZ='Asia/Kolkata' date)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Reason: ${{ github.event.inputs.reason }}"
          fi

      - name: Check data directory exists
        run: |
          if [ ! -d "data/equity" ]; then
            echo "ERROR: data/equity/ directory not found. Has the NSE fetch run today?"
            exit 1
          fi
          echo "Equity data directory exists ✓"
          echo "Most recent files:"
          find data/equity -name "*.csv" | sort -r | head -5

      - name: Run seasonal signals script
        run: |
          python scripts/prepare_seasonal_signals.py

      - name: Verify output
        run: |
          echo "Output files:"
          ls -lh seasonal_signals/ 2>/dev/null || echo "seasonal_signals/ not created!"
          if [ -f "seasonal_signals/latest.json" ]; then
            echo ""
            echo "=== latest.json preview ==="
            python -c "
          import json
          with open('seasonal_signals/latest.json') as f:
              d = json.load(f)
          print(f'Date: {d[\"date\"]}')
          print(f'Symbols: {d[\"symbol_count\"]}')
          print(f'Generated: {d[\"generated_at\"]}')
          prices = d['prices']
          for sym in sorted(prices.keys()):
              entry = prices[sym]
              close = entry['close'] if isinstance(entry, dict) else entry
              chg = entry.get('chg_pct', '') if isinstance(entry, dict) else ''
              chg_str = f' ({chg:+.2f}%)' if isinstance(chg, float) else ''
              print(f'  {sym:<14} ₹{close:.2f}{chg_str}')
          "
          else
            echo "ERROR: latest.json was not created!"
            exit 1
          fi

      - name: Commit and push seasonal_signals/ to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add seasonal_signals/latest.json
          git add seasonal_signals/prev.json 2>/dev/null || true

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — prices unchanged since last run."
          else
            DATE_IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "🔄 Seasonal signals update — ${DATE_IST}"
            git push
            echo "✅ Pushed seasonal_signals/ to repo."
          fi
