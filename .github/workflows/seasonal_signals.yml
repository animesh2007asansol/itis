name: Seasonal Signals — Prepare JSON

on:
  schedule:
    # 6:00 PM UTC = 11:30 PM IST, Mon-Fri (2.5 hrs after 9 PM IST NSE fetch)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

jobs:
  prepare-signals:
    name: Prepare Seasonal Signals JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show trigger info
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC: $(date -u)"
          echo "IST: $(TZ='Asia/Kolkata' date)"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "Reason: ${{ github.event.inputs.reason }}" || true

      - name: Check equity data directory
        run: |
          if [ ! -d "data/equity" ]; then
            echo "ERROR: data/equity/ not found"
            exit 1
          fi
          echo "Latest CSVs:"
          find data/equity -name "*.csv" | sort -r | head -5 || true

      - name: Inspect latest CSV (format diagnostic)
        run: |
          LATEST=$(find data/equity -name "*.csv" | sort -r | head -1)
          echo "Inspecting: $LATEST"
          echo ""
          echo "=== First line (header) ==="
          head -1 "$LATEST"
          echo ""
          echo "=== Second line (first data row) ==="
          sed -n '2p' "$LATEST"
          echo ""
          echo "=== Lines containing VOLTAS or TITAN ==="
          grep -m3 "VOLTAS\|TITAN\|AMBER\|COALINDIA\|KALYANKJIL" "$LATEST" | head -5 || echo "(none found with grep)"
          echo ""
          echo "=== Total rows ==="
          wc -l "$LATEST"

      - name: Run seasonal signals script
        run: |
          python scripts/prepare_seasonal_signals.py

      - name: Verify output files
        run: |
          echo "=== Output files ==="
          ls -lh seasonal_signals/ 2>/dev/null || echo "seasonal_signals/ not created!"
          echo ""
          if [ -f "seasonal_signals/latest.json" ]; then
            echo "=== latest.json summary ==="
            python -c "
          import json
          with open('seasonal_signals/latest.json') as f:
              d = json.load(f)
          print(f'Date:    {d[\"date\"]}')
          print(f'Format:  {d.get(\"csv_format\",\"unknown\")}')
          print(f'Symbols: {d[\"symbol_count\"]}')
          prices = d['prices']
          for sym in sorted(prices.keys()):
              e = prices[sym]
              close = e['close'] if isinstance(e, dict) else e
              chg   = e.get('chg_pct','') if isinstance(e, dict) else ''
              chg_s = f' ({chg:+.2f}%)' if isinstance(chg, float) else ''
              print(f'  {sym:<14} Rs{close:.2f}{chg_s}')
          "
          fi
          echo ""
          if [ -f "seasonal_signals/backtest.json" ]; then
            echo "=== backtest.json summary ==="
            python -c "
          import json
          with open('seasonal_signals/backtest.json') as f:
              d = json.load(f)
          print(f'Start:      Rs{d[\"start_capital\"]:,}')
          print(f'Final:      Rs{d[\"final_capital\"]:,}')
          print(f'Total ret:  {d[\"total_ret_pct\"]:+.1f}%')
          print(f'5yr CAGR:   {d[\"cagr_5yr\"]:+.1f}%')
          print(f'Win rate:   {d[\"win_rate_pct\"]}% ({d[\"total_wins\"]}/{d[\"total_trades\"]})')
          print(f'Formats:    {d.get(\"csv_formats_used\",{})}')
          print()
          for y in d['year_summary']:
              p = y['partial']
              print(f'  {y[\"fy\"]}  {y[\"ret_pct\"]:>+6.1f}%  {y[\"wins\"]}W {y[\"losses\"]}L  Rs{y[\"end_capital\"]:>9,}  {\"(partial)\" if p else \"\"}')
          print()
          missing = [t for t in d['trades'] if t.get('verdict','').startswith('DATA MISSING')]
          if missing:
              print(f'DATA MISSING ({len(missing)} trades):')
              for t in missing:
                  print(f'  {t[\"sym\"]} {t[\"fy\"]}: {t[\"data_note\"] or t[\"verdict\"]}')
          "
          fi

      - name: Commit and push to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seasonal_signals/latest.json seasonal_signals/prev.json seasonal_signals/backtest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — prices unchanged since last run."
          else
            DATE_IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "Seasonal signals update — ${DATE_IST}"
            git push
            echo "Pushed seasonal_signals/ to repo."
          fi
