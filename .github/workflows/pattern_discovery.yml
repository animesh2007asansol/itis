name: NSE Pattern Discovery + Heavyweight

on:
  schedule:
    - cron: '15 18 * * 1-5'   # 11:45 PM IST Mon-Fri
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason'
        required: false
        default: 'Manual trigger'
      force_full_rerun:
        description: 'Force full rerun (true/false)'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  discover:
    name: Pattern Discovery + Heavyweight
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy --quiet

      - name: Info
        run: |
          echo "Trigger : ${{ github.event_name }}"
          echo "UTC     : $(date -u)"
          echo "IST     : $(TZ='Asia/Kolkata' date)"
          echo "Equity CSVs: $(find data/equity -name '*.csv' 2>/dev/null | wc -l)"
          [ -f pattern_signals/checkpoint.json ] && \
            cat pattern_signals/checkpoint.json || echo "No checkpoint yet"

      # ── Step 1: Pattern Discovery ────────────────────────────────────────
      - name: Run pattern discovery
        run: python scripts/pattern_discovery.py
        timeout-minutes: 300
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'
          FORCE_FULL_RERUN: ${{ github.event.inputs.force_full_rerun || 'false' }}

      # ── Step 2: Heavyweight Dip-Recover ─────────────────────────────────
      - name: Run heavyweight dip-recover analysis
        run: python scripts/heavyweight_dip_recover.py

      - name: Clear stale candle checkpoint (force fresh run on version change)
        run: |
          if [ -f pattern_signals/candle_checkpoint.json ]; then
            ver=$(python3 -c "import json; d=json.load(open('pattern_signals/candle_checkpoint.json')); print(d.get('script_version',''))" 2>/dev/null || echo "")
            if [ "$ver" != "v3.1" ]; then
              echo "Old version ($ver) detected — removing checkpoint to force fresh run"
              rm -f pattern_signals/candle_checkpoint.json
            fi
          fi

      - name: Run candle pattern tracker
        run: python scripts/candle_patterns.py
        timeout-minutes: 60
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Show summary
        if: always()
        run: |
          echo "=== Output files ==="
          ls -lh pattern_signals/ 2>/dev/null || echo "No output!"

          # patterns.json
          [ -f pattern_signals/patterns.json ] && python3 - << 'PYEOF'
          import json
          d = json.load(open('pattern_signals/patterns.json'))
          print(f"Stocks analyzed : {d.get('stocks_analyzed','—')}")
          print(f"Trading days    : {d.get('trading_days','—')}")
          print(f"Grade counts    : {d.get('grade_counts',{})}")
          for p in d.get('patterns',[])[:5]:
              print(f"  {p.get('grade','—')} {p.get('signal',''):<5} "
                    f"WR20:{p.get('wr_20d','—')}% Avg20:{p.get('avg_20d','—')}% "
                    f"{p.get('name','')[:30]}")
          PYEOF

          # alerts.json
          [ -f pattern_signals/alerts.json ] && python3 - << 'PYEOF'
          import json
          d = json.load(open('pattern_signals/alerts.json'))
          print(f"\nPattern alerts  : {d.get('total_alerts',0)} "
                f"(today:{d.get('today_count',0)} grade_a:{d.get('grade_a',0)})")
          for a in d.get('alerts',[])[:5]:
              print(f"  [{a.get('grade','—')}] {a.get('sym',''):<12} "
                    f"{a.get('signal_name','')[:25]:<27} "
                    f"WR20:{a.get('win_rate_20d',0)}% "
                    f"Min:{a.get('min_ret_20d',0):+.1f}%")
          PYEOF

          # stock_profiles.json
          [ -f pattern_signals/stock_profiles.json ] && python3 - << 'PYEOF'
          import json
          d = json.load(open('pattern_signals/stock_profiles.json'))
          print(f"\nStock profiles  : {d.get('stocks_with_100pct',0)} stocks "
                f"(A+:{d.get('n_aplus',0)} A:{d.get('n_a',0)} B:{d.get('n_b',0)})")
          for r in d.get('all_grade_a',[])[:5]:
              print(f"  {r.get('sym',''):<12} {r.get('signal',''):<5} "
                    f"Avg20:{r.get('avg_20d',0):+.1f}% "
                    f"Min20:{r.get('min_20d',0):+.1f}% "
                    f"Worst:{r.get('worst_return',0):+.1f}% "
                    f"Occ:{r.get('occ_20d',0)}")
          PYEOF

          # heavyweight_profiles.json
          [ -f pattern_signals/heavyweight_profiles.json ] && python3 - << 'PYEOF'
          import json
          d = json.load(open('pattern_signals/heavyweight_profiles.json'))
          print(f"\nHeavyweight     : {d.get('n_stocks',0)} stocks "
                f"(A+:{d.get('n_aplus',0)} A:{d.get('n_a',0)} B:{d.get('n_b',0)})")
          for sym, p in list(d.get('profiles',{}).items())[:5]:
              bw = p.get('best_window_days',20)
              ws = p.get('win_stats',{}).get(str(bw),{})
              print(f"  {sym:<12} {p.get('grade','—')} "
                    f"{bw}d: MinRet:{p.get('best_min_return',0):+.1f}% "
                    f"Beats15:{p.get('best_beats15_rate',0):.0f}% "
                    f"Occ:{p.get('n_events',0)} Yrs:{p.get('n_years',0)}")
          PYEOF

          # heavyweight_alerts.json
          [ -f pattern_signals/heavyweight_alerts.json ] && python3 - << 'PYEOF'
          import json
          d = json.load(open('pattern_signals/heavyweight_alerts.json'))
          print(f"\nHeavyweight alerts: {d.get('total_alerts',0)} "
                f"(today:{d.get('today_count',0)})")
          for a in d.get('alerts',[])[:5]:
              print(f"  [{a.get('grade','—')}] {a.get('sym',''):<12} "
                    f"{a.get('best_window_days','?')}d "
                    f"MinRet:{a.get('min_return',0):+.1f}% "
                    f"Beats15:{a.get('beats15_rate',0):.0f}% "
                    f"Close:Rs{a.get('sig_close',0)} {a.get('zone','')}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pattern_signals/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            DATE=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "📊 Patterns + Heavyweight — ${DATE}"
            for i in 1 2 3; do
              git push && break || { sleep 5; git pull --rebase; }
            done
          fi
