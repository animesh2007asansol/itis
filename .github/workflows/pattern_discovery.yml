name: NSE Pattern Discovery

on:
  schedule:
    # 11:45 PM IST = 6:15 PM UTC, Mon-Fri (after NSE fetch + pin bar analysis)
    - cron: '15 18 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual trigger'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  discover-patterns:
    name: Discover NSE Patterns
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy --quiet

      - name: Show trigger info
        run: |
          echo "Trigger : ${{ github.event_name }}"
          echo "Reason  : ${{ github.event.inputs.reason || 'scheduled' }}"
          echo "UTC     : $(date -u)"
          echo "IST     : $(TZ='Asia/Kolkata' date)"
          echo "Equity CSVs available: $(find data/equity -name '*.csv' 2>/dev/null | wc -l)"

      - name: Run pattern discovery
        run: python scripts/pattern_discovery.py
        timeout-minutes: 300
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'

      - name: Show output summary
        if: always()
        run: |
          echo "=== Output files ==="
          ls -lh pattern_signals/ 2>/dev/null || echo "pattern_signals/ not created!"
          echo ""

          # ── patterns.json ──────────────────────────────────────
          if [ -f "pattern_signals/patterns.json" ]; then
            python3 - << 'PYEOF'
          import json
          with open('pattern_signals/patterns.json') as f:
              d = json.load(f)
          print(f"Stocks analyzed : {d.get('stocks_analyzed', '—')}")
          print(f"Trading days    : {d.get('trading_days', '—')}")
          print(f"Data range      : {d.get('data_range', '—')}")
          print(f"Grade counts    : {d.get('grade_counts', {})}")
          print()
          patterns = d.get('patterns', [])
          print(f"Top 10 cross-stock patterns ({len(patterns)} total):")
          for p in patterns[:10]:
              print(f"  {p.get('grade','—')}  {p.get('signal',''):<5}  "
                    f"WR20:{p.get('wr_20d','—')}%  "
                    f"Avg20:{p.get('avg_20d','—')}%  "
                    f"Score:{p.get('score',0):<8}  "
                    f"{p.get('name','')[:35]}")
          PYEOF
          fi
          echo ""

          # ── alerts.json ────────────────────────────────────────
          if [ -f "pattern_signals/alerts.json" ]; then
            python3 - << 'PYEOF'
          import json
          with open('pattern_signals/alerts.json') as f:
              d = json.load(f)
          print(f"Alert date      : {d.get('alert_date') or d.get('latest_date', '—')}")
          print(f"Total alerts    : {d.get('total_alerts', 0)}")
          print(f"Today alerts    : {d.get('today_count', 0)}")
          print(f"Grade A alerts  : {d.get('grade_a', 0)}")
          print()
          for a in d.get('alerts', [])[:15]:
              print(f"  [{a.get('grade','—')}] {a.get('sym',''):<14}  "
                    f"{a.get('signal_name','')[:28]:<30}  "
                    f"WR20:{a.get('win_rate_20d') or a.get('wr_20d',0)}%  "
                    f"Close:Rs{a.get('sig_close') or a.get('close',0)}")
          PYEOF
          fi
          echo ""

          # ── stock_profiles.json ────────────────────────────────
          if [ -f "pattern_signals/stock_profiles.json" ]; then
            python3 - << 'PYEOF'
          import json
          with open('pattern_signals/stock_profiles.json') as f:
              d = json.load(f)
          print(f"Stocks with 100% patterns : {d.get('stocks_with_100pct') or d.get('n_stocks', 0)}")
          print(f"Grade A+                  : {d.get('n_aplus', 0)}")
          print(f"Grade A                   : {d.get('n_a', 0)}")
          print()
          print("Top 15 Grade A+ / A stock patterns (by avg 20d return):")
          grade_a = d.get('all_grade_a') or [
              r for r in d.get('all_results', [])
              if r.get('grade') in ('A+', 'A')
          ]
          for r in grade_a[:15]:
              print(f"  {r.get('sym',''):<14}  {r.get('signal',''):<5}  "
                    f"WR20:{r.get('wr_20d',0)}%  "
                    f"Avg20:{r.get('avg_20d',0):+.1f}%  "
                    f"Occ:{r.get('occ_20d',0)}  "
                    f"Yrs:{r.get('n_years',0)}")
          PYEOF
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pattern_signals/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE_IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "📊 Pattern signals update — ${DATE_IST}"
            for i in 1 2 3; do
              git push && break || { echo "Retry $i..."; sleep 5; git pull --rebase; }
            done
            echo "Pushed pattern_signals/ to repo."
          fi
