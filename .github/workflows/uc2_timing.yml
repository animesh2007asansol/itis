name: UC2 Seasonal Timing Optimizer

on:
  workflow_dispatch: {}          # Run manually from GitHub Actions tab
  workflow_run:                  # Auto-run after main analysis completes
    workflows: ["Master Stock Analysis v3"]
    types: [completed]

jobs:
  uc2-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy --quiet

      - name: Run UC2 Timing Optimizer
        run: python scripts/uc2_timing_optimizer.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_analysis/uc2_timing.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "UC2 timing: optimal entry/exit windows [$(date '+%Y-%m-%d')]"
          git push
