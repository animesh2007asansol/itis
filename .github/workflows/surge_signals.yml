name: Surge Continuation Analyzer

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 16 * * 1-5'    # 9:30 PM IST Mon-Fri (15 min after NSE Daily Data Fetch at 9:15 PM IST)
  workflow_run:
    workflows: ["NSE Daily Data Fetch"]
    types: [completed]

jobs:
  surge-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy --quiet
      - name: Run Surge Continuation Analyzer
        run: python scripts/surge_continuation_analyzer.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_analysis/surge_signals.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "Surge signals: continuation alerts [$(date '+%Y-%m-%d %H:%M IST')]"
          git push
