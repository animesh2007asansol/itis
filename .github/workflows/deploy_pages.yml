name: 🌐 Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'logs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Build site (exclude data and logs)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp README.md _site/ 2>/dev/null || true
          cp NSE_PROJECT_CONTEXT.md _site/ 2>/dev/null || true
          mkdir -p _site/scripts
          cp scripts/*.py _site/scripts/ 2>/dev/null || true
          cp scripts/requirements.txt _site/scripts/ 2>/dev/null || true
          mkdir -p _site/.github/workflows
          cp .github/workflows/*.yml _site/.github/workflows/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "Files in _site:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
