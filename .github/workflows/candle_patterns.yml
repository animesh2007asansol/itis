name: Candle Pattern Analyzer

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '15 16 * * 1-5'
  workflow_run:
    workflows: ["NSE Daily Data Fetch"]
    types: [completed]

jobs:
  candle-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy --quiet
      - name: Run Candle Pattern Analyzer
        run: python scripts/candle_pattern_analyzer.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_analysis/candle_patterns.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "Candle patterns: alerts updated [$(date '+%Y-%m-%d')]"
          git push
