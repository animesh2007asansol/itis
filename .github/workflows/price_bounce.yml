name: Price Bounce Tracker (Daily)

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["NSE Daily Data Fetch"]
    types: [completed]
  schedule:
    - cron: '45 16 * * 1-5'   # 10:15 PM IST Mon-Fri

jobs:
  price-bounce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy --quiet
      - name: Run Price Bounce Tracker
        run: python scripts/price_bounce_tracker.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_analysis/price_bounce.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "Price bounce: support alerts [$(date '+%Y-%m-%d')]"
          git push
