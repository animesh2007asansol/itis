name: 🗂️ NSE Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2024-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD, default: today)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  backfill:
    name: Backfill Historical NSE Data
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours max

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run backfill
        run: |
          END="${{ github.event.inputs.end_date }}"
          if [ -z "$END" ]; then
            python scripts/backfill.py "${{ github.event.inputs.start_date }}"
          else
            python scripts/backfill.py "${{ github.event.inputs.start_date }}" "$END"
          fi
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'

      - name: Commit and push backfilled data
        run: |
          git config --global user.name  "NSE Data Bot 🤖"
          git config --global user.email "nse-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "📚 Backfill: ${{ github.event.inputs.start_date }} → ${{ github.event.inputs.end_date || 'today' }}"
            git push
          fi
