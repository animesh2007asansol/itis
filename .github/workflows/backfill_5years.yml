# ──────────────────────────────────────────────────────────────────
#  NSE 5-Year Historical Backfill
#
#  Architecture:
#    • One job per year — run in parallel
#    • Each job uploads its data as a GitHub Actions artifact
#    • A final "commit" job downloads ALL artifacts and pushes
#      everything to main in ONE commit (avoids merge conflicts)
#
#  How to run:
#    Actions tab → "📚 NSE 5-Year Backfill" → Run workflow
# ──────────────────────────────────────────────────────────────────

name: 📚 NSE 5-Year Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'First year to fetch (default 2020)'
        required: false
        default: '2020'
      end_year:
        description: 'Last year to fetch (default: current year)'
        required: false
        default: ''
      delay_min:
        description: 'Min sleep between requests in seconds (default 2)'
        required: false
        default: '2'
      delay_max:
        description: 'Max sleep between requests in seconds (default 4)'
        required: false
        default: '4'

# ── Force Node.js 24 (suppresses deprecation warnings) ──────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# Only one backfill can run at a time (avoid git conflicts)
concurrency:
  group: nse-backfill
  cancel-in-progress: false

jobs:

  # ────────────────────────────────────────────────────────────
  #  STEP 1: Generate the year matrix
  # ────────────────────────────────────────────────────────────
  setup:
    name: Generate year matrix
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.gen.outputs.years }}

    steps:
      - name: Generate year list
        id: gen
        run: |
          START="${{ github.event.inputs.start_year }}"
          START="${START:-2020}"

          END_INPUT="${{ github.event.inputs.end_year }}"
          if [ -z "$END_INPUT" ]; then
            END=$(TZ="Asia/Kolkata" date +'%Y')
          else
            END="$END_INPUT"
          fi

          echo "Will fetch years: $START → $END"

          # Build JSON array e.g. ["2020","2021","2022"]
          YEARS="["
          for Y in $(seq "$START" "$END"); do
            YEARS="${YEARS}\"$Y\","
          done
          YEARS="${YEARS%,}]"   # strip trailing comma
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
          echo "Matrix: $YEARS"

  # ────────────────────────────────────────────────────────────
  #  STEP 2: One parallel job per year
  # ────────────────────────────────────────────────────────────
  fetch-year:
    name: Fetch ${{ matrix.year }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 5h 40m — NSE is slow, be generous

    strategy:
      matrix:
        year: ${{ fromJson(needs.setup.outputs.years) }}
      fail-fast: false     # one year failing must not cancel others

    steps:

      # 1. Checkout scripts only — fast, no data bloat
      - name: Checkout (scripts only)
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false

      # 2. Always create data dirs FIRST
      #    This guarantees the artifact upload step always finds something,
      #    even if every single date was a holiday/failure.
      - name: Create directory structure
        run: |
          YEAR=${{ matrix.year }}
          mkdir -p \
            data/equity/$YEAR \
            data/fo/$YEAR \
            data/index/$YEAR \
            data/delivery/$YEAR \
            data/corporate_actions/$YEAR \
            data/sme/$YEAR \
            data/full_bhav/$YEAR \
            logs
          # Sentinel: artifact upload needs ≥1 file
          printf "year=%s\nrun=%s\n" "$YEAR" "$(date -u)" \
            > data/.sentinel_$YEAR

      # 3. Pull already-fetched files from main (idempotent re-runs)
      - name: Pull existing ${{ matrix.year }} data from main
        run: |
          YEAR=${{ matrix.year }}
          git fetch origin main --depth=1 2>/dev/null || true
          for CAT in equity fo index delivery corporate_actions sme full_bhav; do
            git checkout origin/main -- "data/$CAT/$YEAR" 2>/dev/null || true
          done
          echo "Existing CSVs for $YEAR: $(find data/ -name '*.csv' | wc -l)"

      # 4. Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 5. The actual download
      - name: Run backfill for ${{ matrix.year }}
        run: |
          python scripts/backfill_historical.py \
            --year "${{ matrix.year }}" \
            --delay-min "${{ github.event.inputs.delay_min || '2' }}" \
            --delay-max "${{ github.event.inputs.delay_max || '4' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'

      # 6. Show what we got
      - name: Count results
        if: always()
        run: |
          echo "CSVs downloaded for ${{ matrix.year }}:"
          find data/ -name "*.csv" | sort | head -10
          echo "  Total: $(find data/ -name '*.csv' | wc -l)"

      # 7. Upload artifact — sentinel .txt ensures this never errors
      - name: Upload artifact for ${{ matrix.year }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-data-${{ matrix.year }}
          path: data/
          retention-days: 3
          if-no-files-found: ignore   # sentinel file prevents this case anyway

  # ────────────────────────────────────────────────────────────
  #  STEP 3: Merge all artifacts and push ONE commit
  # ────────────────────────────────────────────────────────────
  commit-all:
    name: Merge & commit all years
    needs: fetch-year
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()   # run even when some years had failures

    steps:

      - name: Checkout main (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # Download each year's artifact into its own subdirectory
      # (merge-multiple:false prevents filename collisions across years)
      - name: Download all year artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nse-data-*
          path: artifacts/
          merge-multiple: false

      # Merge into data/ — existing files win (no overwrites)
      - name: Merge artifacts into data/
        run: |
          mkdir -p data/
          for YEAR_DIR in artifacts/nse-data-*/; do
            [ -d "$YEAR_DIR" ] || continue
            echo "Merging $YEAR_DIR …"
            rsync -a --ignore-existing "$YEAR_DIR" data/
          done
          # Remove sentinel files — they are not real data
          find data/ -name ".sentinel_*" -delete
          echo "Total CSVs after merge: $(find data/ -name '*.csv' | wc -l)"

      # Rebuild manifest + summary from what's on disk
      - name: Set up Python for manifest rebuild
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild manifest.json + summary.json
        run: |
          python - <<'PYEOF'
          import json, re
          from pathlib import Path
          from datetime import datetime

          BASE     = Path(".")
          DATA     = BASE / "data"
          MANIFEST = DATA / "manifest.json"
          SUMMARY  = DATA / "summary.json"

          manifest = {}
          if MANIFEST.exists():
              try:
                  manifest = json.loads(MANIFEST.read_text())
              except Exception:
                  manifest = {}

          CATEGORIES = ["equity", "fo", "index", "delivery",
                        "corporate_actions", "sme", "full_bhav"]

          for cat in CATEGORIES:
              cat_dir = DATA / cat
              if not cat_dir.exists():
                  continue
              for csv in sorted(cat_dir.rglob("*.csv")):
                  if csv.name == "master.csv":
                      continue   # all-time file, not date-specific
                  m = re.match(r"(\d{4}-\d{2}-\d{2})", csv.stem)
                  if not m:
                      continue
                  date_str = m.group(1)
                  if date_str not in manifest:
                      manifest[date_str] = {
                          "fetched_at": datetime.utcnow().isoformat() + "Z",
                          "results":    {},
                          "success":    True,
                          "files":      {},
                      }
                  manifest[date_str]["results"][cat] = True
                  manifest[date_str]["files"][cat]   = str(csv.relative_to(BASE))

          manifest = dict(sorted(manifest.items(), reverse=True))
          MANIFEST.write_text(json.dumps(manifest, indent=2))

          total = len(manifest)
          ok    = sum(1 for v in manifest.values() if v.get("success"))
          cats  = set()
          for v in manifest.values():
              cats.update(v.get("files", {}).keys())

          SUMMARY.write_text(json.dumps({
              "last_updated":         datetime.utcnow().isoformat() + "Z",
              "total_trading_days":   total,
              "successful_fetches":   ok,
              "categories_available": sorted(cats),
              "latest_date":          next(iter(manifest), None),
          }, indent=2))

          print(f"Manifest rebuilt: {total} dates, {ok} successful")
          PYEOF

      - name: Commit and push
        run: |
          git config --global user.name  "NSE Data Bot 🤖"
          git config --global user.email "nse-bot@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "Nothing new — all data was already in main."
          else
            CSV_COUNT=$(find data/ -name "*.csv" | wc -l)
            S="${{ github.event.inputs.start_year || '2020' }}"
            E="${{ github.event.inputs.end_year }}"
            E="${E:-$(TZ='Asia/Kolkata' date +'%Y')}"
            git commit -m "📚 Backfill ${S}–${E}: ${CSV_COUNT} CSVs [auto]"

            for i in 1 2 3 4 5; do
              git push && break || {
                echo "Push attempt $i failed — rebasing in 10s…"
                git pull --rebase
                sleep 10
              }
            done
          fi

      - name: Final summary
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "  Total CSVs in repo: $(find data/ -name '*.csv' | wc -l)"
          [ -f data/summary.json ] && cat data/summary.json
          echo "════════════════════════════════════"
